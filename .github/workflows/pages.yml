name: Deploy to GitHub Pages

# Every push (to any branch) or branch deletion rebuilds the whole site:
# the default branch at the root and each other branch under /<branch>/
# (see tools/build_site.sh). The github-pages environment must allow
# deployments from all branches.
on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Each run builds every branch, so only the newest one matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: tools/build_site.sh site
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
